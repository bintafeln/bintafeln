<div class="feld"><label for="meldung_art{{ nr }}">Was?</label>
  <select name="meldung_art" id="meldung_art{{ nr }}">
    <option value="mangel">Beanstandung / Defekt</option>
    <option value="getankt">Getankt</option>
    <option value="sonstiges">Anmerkung</option>
  </select></div>
<div class="feld"><label for="meldung{{ nr }}">Meldung zum Fahrzeug</label>
  <textarea name="meldung" id="meldung{{ nr }}" rows="2" maxlength="500" placeholder="z. B. Abblendlicht links defekt – oder: vollgetankt, 52 Liter"></textarea></div>
