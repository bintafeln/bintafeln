{% load static %}<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aufgerufene Kundennummern</title>
  {% include "includes/farben.html" %}
  <style>
    html, body { margin: 0; background: transparent; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2933;
           text-align: center; padding: 1rem; }
    .titel { font-size: 1.5rem; font-weight: 700; margin: 0 0 .75rem; }
    .ruhe { margin: 0; font-size: 1.1rem; }
    .nummern { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin: 0; }
    .nummern span { background: var(--akzent, #1f5fa8); color: var(--auf-akzent, #fff); border-radius: .6rem;
                    padding: .4rem 1.1rem; font-size: clamp(2rem, 9vw, 4rem); font-weight: 800;
                    font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div id="stand" data-neu-laden="{{ neu_laden }}" aria-live="polite">{% include "aufruf/_homepage_stand.html" %}</div>
  <script src="{% static 'js/aufruf_homepage.js' %}"></script>
  <noscript><meta http-equiv="refresh" content="{{ neu_laden }}"></noscript>
</body>
</html>
