<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kunden-Terminal - Aufruf</title>
    {% include "aufruf/_kopf.html" %}
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            height:100vh; width:100vw; overflow:hidden;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:#5d5ec9;
            color:#fff; user-select:none; -webkit-user-select:none; touch-action:manipulation;
            cursor:none;
        }
        .screen { position:absolute; inset:0; display:none; flex-direction:column;
                  align-items:center; justify-content:center; padding:1.5vh 3vw; text-align:center;
                  overflow-y:auto; }
        .screen.active { display:flex; }

        /* ── IDLE / Eingabe ─────────────────────────────────────── */
        .card-icon { font-size:10vh; animation:pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
        .idle-title { font-size:5vh; font-weight:900; margin-top:1.5vh; text-shadow:2px 2px 5px rgba(0,0,0,.35); }
        .idle-sub   { font-size:2.8vh; opacity:.92; margin-top:.8vh; line-height:1.45; }
        .idle-sub .rtl { direction:rtl; unicode-bidi:embed; }

        .num-display {
            margin-top:1.8vh; min-width:50vw; padding:1.8vh 3vw;
            background:rgba(255,255,255,.95); color:#2c3e50; border-radius:2vh;
            font-size:6.5vh; font-weight:900; font-family:'Courier New', monospace;
            letter-spacing:.6vw; min-height:9.5vh; display:flex; align-items:center; justify-content:center;
            box-shadow:0 6px 18px rgba(0,0,0,.35);
        }
        .num-display.empty { color:#b0b6bd; font-size:3.6vh; letter-spacing:normal; font-family:inherit; }

        .keypad { margin-top:1.6vh; display:grid; grid-template-columns:repeat(3, 15vh); gap:1.2vh; }
        .key {
            height:8.2vh; border:none; border-radius:1.8vh; font-size:4vh; font-weight:900;
            background:rgba(255,255,255,.16); color:#fff; cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,.3); transition:transform .08s ease, background .15s ease;
        }
        .key:active { transform:scale(.94); background:rgba(255,255,255,.3); }
        .key.ok  { background:#27ae60; }
        .key.del { background:rgba(231,76,60,.85); }

        /* ── ERGEBNIS ───────────────────────────────────────────── */
        .res-number { font-size:4.4vh; font-weight:900; opacity:.95; }
        .res-number span { font-family:'Courier New', monospace; background:rgba(255,255,255,.18);
                           padding:.3vh 1.4vw; border-radius:1.2vh; }

        .status-card {
            margin-top:1.4vh; width:94vw; max-width:1900px; border-radius:2.4vh;
            padding:2.4vh 3.5vw; box-shadow:0 10px 26px rgba(0,0,0,.4);
        }
        .status-card.waiting  { background:linear-gradient(135deg,#2980b9,#3498db); }
        .status-card.soon     { background:linear-gradient(135deg,#e67e22,#f39c12); }
        .status-card.done     { background:linear-gradient(135deg,#1e8449,#27ae60); }
        .status-card.notfound { background:linear-gradient(135deg,#c0392b,#e74c3c); }
        .status-card.inactive { background:linear-gradient(135deg,#5d6d7e,#85929e); }

        .lang-block + .lang-block { margin-top:1.2vh; padding-top:1.2vh; border-top:2px dashed rgba(255,255,255,.4); }
        .lang-tag { display:inline-block; font-size:2.4vh; font-weight:700; background:rgba(0,0,0,.22);
                    padding:.3vh 1.2vw; border-radius:1vh; margin-bottom:.8vh; }
        .headline { font-size:4.6vh; font-weight:900; line-height:1.15; text-shadow:2px 2px 5px rgba(0,0,0,.3); }
        .bignum   { font-size:11vh; font-weight:900; font-family:'Courier New', monospace; line-height:1.05;
                    text-shadow:3px 3px 6px rgba(0,0,0,.3); }
        .subline  { font-size:2.8vh; opacity:.95; margin-top:.4vh; }
        .lang-block.rtl { direction:rtl; }

        .detail-grid { margin-top:1.8vh; width:94vw; max-width:1900px;
                       display:grid; grid-template-columns:repeat(4, 1fr); gap:1.2vh; }
        .detail-box { background:rgba(255,255,255,.14); border-radius:1.8vh; padding:1.8vh 1vw; }
        .detail-box .val { font-size:4.6vh; font-weight:900; font-family:'Courier New', monospace; }
        .detail-box .lab { font-size:2.2vh; opacity:.92; margin-top:.4vh; line-height:1.3; }
        .detail-box .lab .nat { display:block; opacity:.85; }
        .detail-box .lab .nat.rtl { direction:rtl; }

        .done-btn {
            margin-top:1.6vh; border:none; border-radius:1.8vh; cursor:pointer;
            background:#27ae60; color:#fff; font-size:3.6vh; font-weight:900;
            padding:1.6vh 8vw; box-shadow:0 6px 16px rgba(0,0,0,.35);
        }
        .done-btn:active { transform:scale(.95); }
        .countdown { margin-top:1vh; font-size:2.4vh; opacity:.8; }

        .clock { position:fixed; top:1.5vh; right:2vw; font-size:3vh; font-weight:700; opacity:.8; }

        /* ── Scanner-Hilfe unten rechts (nur Ruhebildschirm) ── */
        .scan-hint {
            position:fixed; right:2vw; bottom:1.5vh; height:38vh;
            z-index:50; pointer-events:none; transition:opacity .4s ease;
            display:flex; flex-direction:row; align-items:flex-start; gap:1.2vh;
        }
        /* linker Block: Grafik-Einheit + Label darunter */
        .scan-left { display:flex; flex-direction:column; align-items:center; height:100%; }
        .scan-left svg { flex:1; min-height:0; }
        /* rechter Block: nur der Pfeil, exakt volle Höhe (Spitze bleibt im Bild) */
        .scan-arrow-col {
            width:5vh; height:100%;
            position:relative; display:flex; flex-direction:column; align-items:center;
        }
        /* Schaft: dünne, hohe Linie, füllt die Spalte bis kurz vor die Spitze */
        .arrow-shaft {
            flex:1; width:5px; background:#ffd54a; border-radius:3px; margin-bottom:-2px;
        }
        /* Spitze: nach unten zeigendes Dreieck */
        .arrow-head {
            width:0; height:0;
            border-left:11px solid transparent;
            border-right:11px solid transparent;
            border-top:16px solid #ffd54a;
        }
        .scan-hint.hidden { opacity:0; }
        .scan-hint .cardmove { animation:cardUp 3.2s ease-in-out infinite; transform-origin:center; }
        @keyframes cardUp {
            0%   { transform:translateY(46px); opacity:0; }
            22%  { opacity:1; }
            48%  { transform:translateY(0);    opacity:1; }
            78%  { transform:translateY(0);    opacity:1; }
            100% { transform:translateY(46px); opacity:0; }
        }
        .scan-hint .beam { animation:beamFlash 0.9s ease-in-out infinite; }
        .scan-hint .scanline { animation:scanLine 3.2s ease-in-out infinite; }
        .scan-hint .scan-arrow-col { animation:arrowPulse 1.6s ease-in-out infinite; }
        @keyframes arrowPulse {
            0%,100% { opacity:.55; transform:translateY(0); }
            50%     { opacity:1;   transform:translateY(3px); }
        }
        @keyframes scanLine {
            /* Karte kommt hoch (0-22%): Linie unsichtbar */
            0%, 22%   { transform:translateY(0);   opacity:0; }
            /* Karte oben & ruht (22-78%): Linie fährt mehrfach über den Barcode */
            26%       { opacity:1; }
            30%       { transform:translateY(20px); }
            40%       { transform:translateY(0);    }
            50%       { transform:translateY(20px); }
            60%       { transform:translateY(0);    }
            70%       { transform:translateY(20px); }
            74%       { transform:translateY(0);    }
            78%       { opacity:1; }
            /* Karte fährt runter (78-100%): Linie unsichtbar */
            82%, 100% { transform:translateY(0);   opacity:0; }
        }
        @keyframes beamFlash {
            0%   { opacity:0; }
            35%  { opacity:.95; }
            70%  { opacity:.15; }
            100% { opacity:0; }
        }
        .hintlabel {
            transition:opacity .3s ease;
            margin-top:.6vh; flex:0 0 auto;
            font-size:1.9vh; font-weight:700; color:#fff; opacity:.9;
            white-space:nowrap; text-align:center; text-shadow:1px 1px 3px rgba(0,0,0,.5);
            background:rgba(0,0,0,.28); padding:.5vh 2vw; border-radius:1vh;
            min-width:24vh;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock"></div>

    <!-- ═══ SCANNER-HILFE (animiert, nur Ruhebildschirm) ═══ -->
    <div class="scan-hint" id="scanHint">
      <div class="scan-left">
        <svg viewBox="0 0 240 274" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <defs>
                <!-- weicher Schatten (dezent, auf lila Hintergrund abgestimmt) -->
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
                    <feOffset dx="4" dy="6" result="off"/>
                    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
                    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <!-- Grafik nach links geschoben, damit rechts Platz für den Pfeil ist -->
            <g transform="translate(0 0)">
            <!-- ═══ MONITOR als geneigtes Trapez ═══ -->
            <polygon points="52,28 196,28 214,150 34,150" fill="#23272e" stroke="#0d0f12" stroke-width="2" stroke-linejoin="round" filter="url(#softShadow)"/>
            <polygon points="62,38 186,38 200,140 48,140" fill="#5d5ec9"/>
            <!-- echter Ruhebildschirm-Inhalt: Karten-Symbol + Hinweistext -->
            <clipPath id="scrClip"><polygon points="62,38 186,38 200,140 48,140"/></clipPath>
            <g clip-path="url(#scrClip)" text-anchor="middle" fill="#ffffff">
                <text x="124" y="78" font-size="26">💳</text>
                <text x="124" y="98" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold">Bitte Karte scannen</text>
                <text x="124" y="112" font-family="Arial, sans-serif" font-size="5.5" opacity="0.9">Please scan your card</text>
                <text x="124" y="121" font-family="Arial, sans-serif" font-size="5.5" opacity="0.9">Відскануйте картку</text>
            </g>
            <polygon points="62,38 186,38 184,44 64,44" fill="#ffffff" opacity="0.12"/>
            <rect x="150" y="148" width="30" height="6" rx="2" fill="#2c3038" transform="rotate(4 165 151)"/>

            <!-- ═══ SCANNER unten rechts, schaut nach unten ═══ -->
            <g transform="rotate(4 180 160)">
                <rect x="150" y="150" width="56" height="24" rx="5" fill="#15181c" stroke="#000" stroke-width="1.5"/>
                <!-- Fenster leuchtet dauerhaft weiß -->
                <rect x="157" y="166" width="42" height="9" rx="2" fill="#f5f7fa"/>
                <rect x="157" y="166" width="42" height="9" rx="2" fill="none" stroke="#cfd6dc" stroke-width="1"/>
            </g>
            <!-- weißer Lichtschein nach unten -->
            <g>
                <polygon points="160,176 196,176 188,206 168,206" fill="#ffffff" opacity="0.16"/>
            </g>

            <!-- ═══ AUSWEIS (echte Tafel-Karte), von unten herangeführt ═══ -->
            <g class="cardmove">
                <rect x="120" y="196" width="118" height="72" rx="6" fill="#ffffff" stroke="#cfd6dc" stroke-width="1.5"/>
                <!-- Titel -->
                <text x="179" y="212" font-family="Arial, sans-serif" font-size="9" font-weight="bold"
                      text-anchor="middle" fill="#1a1a1a">{{ tafel.name|default:"Tafel"|truncatechars:28 }}</text>
                <!-- Barcode -->
                <g fill="#1a1a1a">
                    <rect x="140" y="217" width="2.5" height="20"/><rect x="144" y="217" width="1.5" height="20"/>
                    <rect x="147" y="217" width="3.5" height="20"/><rect x="152" y="217" width="1.5" height="20"/>
                    <rect x="155" y="217" width="2.5" height="20"/><rect x="159" y="217" width="1.5" height="20"/>
                    <rect x="162" y="217" width="3.5" height="20"/><rect x="167" y="217" width="2" height="20"/>
                    <rect x="171" y="217" width="1.5" height="20"/><rect x="174" y="217" width="3" height="20"/>
                    <rect x="179" y="217" width="1.5" height="20"/><rect x="182" y="217" width="2.5" height="20"/>
                    <rect x="186" y="217" width="3.5" height="20"/><rect x="191" y="217" width="1.5" height="20"/>
                    <rect x="194" y="217" width="2.5" height="20"/><rect x="198" y="217" width="1.5" height="20"/>
                    <rect x="201" y="217" width="3.5" height="20"/><rect x="206" y="217" width="2" height="20"/>
                    <rect x="210" y="217" width="1.5" height="20"/><rect x="213" y="217" width="3" height="20"/>
                </g>
                <!-- rote Scan-Linie, wandert über den Barcode (wie echter Scanner) -->
                <line class="scanline" x1="140" y1="217" x2="216" y2="217"
                      stroke="#ff2d1a" stroke-width="2" stroke-linecap="round"/>
                <!-- Adresse -->
                <text x="179" y="245" font-family="Arial, sans-serif" font-size="5.3" font-weight="bold"
                      text-anchor="middle" fill="#1a1a1a">{{ stelle.name }}{% if stelle.anschrift %}, {{ stelle.anschrift|truncatechars:40 }}{% endif %}</text>
                <!-- Datum links (bewusst unscharf/unlesbar) + Nummer rechts, räumlich getrennt -->
                <text x="128" y="255" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold"
                      fill="#1a1a1a" opacity="0.85" style="filter:blur(0.7px)">Montag 14:00</text>
                <text x="172" y="255" font-family="Arial, sans-serif" font-size="8" font-weight="bold"
                      text-anchor="start" fill="#1a1a1a">471115</text>
                <text x="230" y="255" font-family="Arial, sans-serif" font-size="8" font-weight="bold"
                      text-anchor="end" fill="#1a1a1a">3 / 2</text>
                <!-- Name -->
                <text x="230" y="263" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold"
                      text-anchor="end" fill="#1a1a1a">Max Mustermann</text>
            </g>
            </g>
        </svg>
        <div class="hintlabel" id="scanHintLabel">Ausweis hier scannen</div>
      </div>
      <div class="scan-arrow-col">
        <div class="arrow-shaft"></div>
        <div class="arrow-head"></div>
      </div>
    </div>

    <!-- ═══ IDLE / EINGABE ═══ -->
    <div class="screen active" id="idleScreen">
        <div class="card-icon">💳</div>
        <div class="idle-title" id="idleTitle">Bitte halten Sie Ihre Karte an den Scanner</div>
        <div class="idle-sub">
            Please scan your card &nbsp;·&nbsp; Відскануйте вашу картку<br>
            <span class="rtl">يرجى مسح بطاقتك</span> &nbsp;·&nbsp; Kartınızı okutunuz
        </div>
        <div class="num-display empty" id="numDisplay">…oder Nummer unten eintippen / or type your number</div>
        <div class="keypad">
            <button class="key" onclick="kp('1')">1</button><button class="key" onclick="kp('2')">2</button><button class="key" onclick="kp('3')">3</button>
            <button class="key" onclick="kp('4')">4</button><button class="key" onclick="kp('5')">5</button><button class="key" onclick="kp('6')">6</button>
            <button class="key" onclick="kp('7')">7</button><button class="key" onclick="kp('8')">8</button><button class="key" onclick="kp('9')">9</button>
            <button class="key del" onclick="kpDel()">⌫</button><button class="key" onclick="kp('0')">0</button><button class="key ok" onclick="submitNumber()">OK</button>
        </div>
    </div>

    <!-- ═══ ERGEBNIS ═══ -->
    <div class="screen" id="resultScreen">
        <div class="res-number" id="resNumber"></div>
        <div class="status-card" id="statusCard"></div>
        <div class="detail-grid" id="detailGrid"></div>
        <button class="done-btn" id="doneBtn" onclick="backToIdle()">✔ Fertig</button>
        <div class="countdown" id="countdown"></div>
    </div>

    {% include "aufruf/_urls.html" %}

/* ═══════════ EINGABE (Scanner + Ziffernblock) ═══════════ */
let buffer = '';
let bufferTimer = null;
let idleTimer = null;
let countdownTimer = null;

const numDisplay = document.getElementById('numDisplay');

function renderBuffer() {
    if (buffer) {
        numDisplay.classList.remove('empty');
        numDisplay.textContent = buffer;
    } else {
        numDisplay.classList.add('empty');
        numDisplay.textContent = '…oder Nummer unten eintippen / or type your number';
    }
}

function kp(d) {
    if (buffer.length < 10) buffer += d;
    renderBuffer();
    resetBufferTimer();
}
function kpDel() { buffer = buffer.slice(0, -1); renderBuffer(); resetBufferTimer(); }
function resetBufferTimer() {
    clearTimeout(bufferTimer);
    bufferTimer = setTimeout(() => { buffer = ''; renderBuffer(); }, 15000);
}

/* Barcode-Scanner: tippt wie eine Tastatur (Ziffern + Enter) */
document.addEventListener('keydown', (e) => {
    // Während das Ergebnisfenster angezeigt wird, Scanner/Tastatur komplett
    // ignorieren — bis per Fertig-Button oder Auto-Reset zurückgestellt wurde.
    // (Escape zum manuellen Zurückstellen bleibt erlaubt.)
    const ergebnisSichtbar = document.getElementById('resultScreen').classList.contains('active');
    if (ergebnisSichtbar) {
        if (e.key === 'Escape') backToIdle();
        e.preventDefault();
        return;
    }
    if (e.key >= '0' && e.key <= '9') {
        kp(e.key);
        e.preventDefault();
    } else if (e.key === 'Enter') {
        submitNumber();
        e.preventDefault();
    } else if (e.key === 'Backspace') {
        kpDel();
        e.preventDefault();
    } else if (e.key === 'Escape') {
        backToIdle();
    }
});

/* ═══════════ ABFRAGE + ANZEIGE ═══════════ */
function submitNumber() {
    const nummer = buffer.trim();
    if (!nummer) return;
    buffer = '';
    renderBuffer();

    fetch(URLS.abfrage + '?nummer=' + encodeURIComponent(nummer) + '&kiosk=1&t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.json())
        .then(d => showResult(nummer, d))
        .catch(() => showResult(nummer, { error: true }));
}

function tr(lang, key, n) {
    const dict = T[lang] || T.de;
    let s = dict[key] || T.de[key] || '';
    return s.replace('{n}', n);
}

function langBlock(lang, cls, lines) {
    const rtl = RTL.has(lang) ? ' rtl' : '';
    const tag = lang !== 'de' ? `<span class="lang-tag">${(T[lang] || {}).name || lang}</span><br>` : '';
    return `<div class="lang-block${rtl}">${tag}${lines}</div>`;
}

function showResult(nummer, d) {
    const card  = document.getElementById('statusCard');
    const grid  = document.getElementById('detailGrid');
    const resNo = document.getElementById('resNumber');
    resNo.innerHTML = `Kundennummer <span>${nummer}</span>`;

    // Kundensprache: nur wenn bekannt, unterstützt und nicht Deutsch
    let lang = (d && d.sprache && T[d.sprache] && d.sprache !== 'de') ? d.sprache : null;
    const langs = lang ? ['de', lang] : ['de'];

    grid.innerHTML = '';

    if (d.error) {
        card.className = 'status-card notfound';
        card.innerHTML = langs.map(L => langBlock(L, '', `<div class="headline">⚠️ ${tr(L,'staff')}</div>`)).join('');
    } else if (!d.active) {
        card.className = 'status-card inactive';
        card.innerHTML = langs.map(L => langBlock(L, '', `<div class="headline">⏳ ${tr(L,'nosession')}</div>`)).join('');
    } else if (!d.gefunden) {
        card.className = 'status-card notfound';
        card.innerHTML = langs.map(L => langBlock(L, '',
            `<div class="headline">🤷 ${tr(L,'notfound')}</div><div class="subline">${tr(L,'staff')}</div>`)).join('');
    } else if (d.neu_einsortiert) {
        // Kunde war schon dran, wurde vom Team neu einsortiert → ruhige Anzeige
        // im Stil der normalen Warteanzeige (nicht dominant/alarmierend).
        const vor = d.vor_der_nummer || 0;
        card.className = 'status-card waiting';
        card.innerHTML = langs.map(L => langBlock(L, '',
            `<div class="headline" style="font-size:3.4vh;">↻ ${tr(L,'reordered')}</div>` +
            `<div class="bignum">${vor}</div>` +
            `<div class="headline" style="font-size:3.4vh;">${tr(L,'before', vor)}</div>` +
            `<div class="subline">${tr(L,'wait')}</div>`
        )).join('');
        renderDetails(grid, d, langs);
    } else if (d.schon_dran) {
        card.className = 'status-card done';
        card.innerHTML = langs.map(L => langBlock(L, '',
            `<div class="headline">✅ ${tr(L,'already')}</div><div class="subline">${tr(L,'staff')}</div>`)).join('');
        renderDetails(grid, d, langs);
    } else {
        // Vorab-Abfrage (Ausgabe noch nicht gestartet): kein "jetzt/gleich",
        // immer voraussichtliche Position mit Hinweis.
        const vorschau = d.vorschau === true;
        const jetzt = !vorschau && d.vor_der_nummer === 0;       // gerade an der Reihe
        const soon  = !vorschau && d.vor_der_nummer > 0 && d.vor_der_nummer <= 3;  // gleich dran
        card.className = 'status-card ' + (jetzt || soon ? 'soon' : 'waiting');
        const zahl = (jetzt || soon) ? '' : `<div class="bignum">${d.vor_der_nummer}</div>`;
        card.innerHTML = zahl + langs.map(L => {
            let head;
            if (jetzt)      head = `<div class="headline">🔔 ${tr(L,'now')}</div>`;
            else if (soon)  head = `<div class="headline">🔔 ${tr(L,'soon')}</div>`;
            else            head = `<div class="headline" style="font-size:3.4vh;">${tr(L,'before', d.vor_der_nummer)}</div>`;
            const hint = vorschau
                ? `<div class="subline" style="opacity:.85;">${tr(L,'preview')}</div>`
                : `<div class="subline">${tr(L,'wait')}</div>`;
            return langBlock(L, '', head + hint);
        }).join('');
        renderDetails(grid, d, langs);
    }

    switchScreen('resultScreen');
    startCountdown(langs);
}

function renderDetails(grid, d, langs) {
    // Infoboxen (eigene Gruppe / aktuelle Gruppe) auf Wunsch entfernt.
    grid.innerHTML = '';
}

/* ═══════════ SCREEN-WECHSEL + AUTO-RESET ═══════════ */
function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const hint = document.getElementById('scanHint');
    if (hint) hint.classList.toggle('hidden', id !== 'idleScreen');
}

function startCountdown(langs) {
    clearInterval(countdownTimer);
    let sec = 30;
    const cd  = document.getElementById('countdown');
    const btn = document.getElementById('doneBtn');
    btn.textContent = '✔ ' + langs.map(L => tr(L, 'done')).join(' / ');
    cd.textContent = sec + ' s';
    countdownTimer = setInterval(() => {
        sec--;
        cd.textContent = sec + ' s';
        if (sec <= 0) backToIdle();
    }, 1000);
}

function backToIdle() {
    clearInterval(countdownTimer);
    buffer = '';
    renderBuffer();
    switchScreen('idleScreen');
}

/* ═══════════ UHR + NÄCHTLICHER RELOAD (Kiosk-Stabilität) ═══════════ */
setInterval(() => {
    const now = new Date();
    document.getElementById('clock').textContent =
        now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    if (now.getHours() === 4 && now.getMinutes() === 0 && now.getSeconds() < 5) {
        location.reload();
    }
}, 1000);

renderBuffer();
(function() {
    const labels = ['Ausweis hier scannen', 'Scan your card here', 'Скануйте картку тут',
                    'Kartınızı buradan okutun', 'امسح البطاقة هنا'];
    let li = 0;
    const el = document.getElementById('scanHintLabel');
    if (el) setInterval(() => {
        li = (li + 1) % labels.length;
        el.style.opacity = '0';
        setTimeout(() => { el.textContent = labels[li]; el.style.opacity = '0.85'; }, 300);
    }, 3200);
})();
console.log('🖥️ Kiosk-Terminal geladen — Scanner bereit');
</script>
