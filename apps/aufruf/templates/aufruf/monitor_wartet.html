<!DOCTYPE html>
<html lang="de">
<head>
  {% include "aufruf/_kopf.html" %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundenmonitor - Warten</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .waiting-container {
            max-width: 800px;
            padding: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .icon {
            font-size: 8em;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        
        .title {
            font-size: 4em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .message {
            font-size: 2.5em;
            margin-bottom: 20px;
            opacity: 0.9;
            font-weight: normal;
        }
        
        .instruction {
            font-size: 1.8em;
            opacity: 0.7;
            font-weight: normal;
            margin-top: 40px;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .icon {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="waiting-container">
        <div class="icon">⏳</div>
        <div class="title">Kundennummern-Monitor</div>
        <div class="message">Ausgabe hat noch nicht begonnen</div>
        <div class="instruction">
            Wir starten mit der Ausgabe, wenn die Vorbereitungen abgeschlossen sind
        </div>
    </div>

    {% include "aufruf/_urls.html" %}
    <script>
        // Alle 10 Sekunden prüfen ob eine Session gestartet wurde
        setInterval(() => {
            fetch(URLS.stand)
                .then(response => response.json())
                .then(data => {
                    if (!data.error) {
                        location.reload();
                    }
                })
                .catch(() => {
                    // Fehler ignorieren, weiter warten
                });
        }, 10000);
    </script>
</body>
</html>
