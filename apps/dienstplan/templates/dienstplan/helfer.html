{% extends "base.html" %}
{% block titel %}Helfer{% endblock %}
{% block inhalt %}
<section class="karte">
  <p><a href="{% url 'dienstplan:einstellungen' %}">← Dienstplan einstellen</a></p>
  <h1>{% if h.pk %}{{ h }}{% else %}Helfer anlegen{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "includes/formular.html" %}
    <button type="submit" class="knopf">Speichern</button>
  </form>
  {% if h.pk %}
  <form method="post" action="{% url 'dienstplan:helfer_loeschen' h.pk %}" class="abseits" onsubmit="return confirm('Helfer wirklich löschen? Die feste Besetzung wird frei.')">
    {% csrf_token %}<button type="submit" class="knopf knopf-gefahr">Helfer löschen</button>
  </form>
  {% endif %}
</section>
{% endblock %}
