<div class="tabelle-rahmen">
<table class="tabelle">
  <thead><tr><th>Termin</th><th>Eingeladen</th><th title="Entschuldigt oder Termin abgesagt">Entschuldigt / abgesagt</th><th title="Erschienen, auch wer danach aufgenommen wurde">Erschienen</th><th>Aufgenommen</th><th>Anmerkung</th><th></th></tr></thead>
  <tbody>
  {% for t in liste %}
    <tr>
      <td data-titel="Termin"><a href="{% url 'warteliste:termin' t.pk %}">{{ t }}</a></td>
      <td data-titel="Eingeladen">{{ t.eingeladen }}</td>
      <td data-titel="Entschuldigt / abgesagt">{{ t.entschuldigt|add:t.abgesagt }}</td>
      <td data-titel="Erschienen">{{ t.erschienen }}</td>
      <td data-titel="Aufgenommen">{{ t.aufgenommen }}</td>
      <td data-titel="Anmerkung">{{ t.anmerkung|default:"" }}</td>
      <td><a href="{% url 'warteliste:druckliste' t.pk %}">Druckliste (PDF)</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="7">Keine.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
