# Zusatz für den Betrieb hinter einem fremden Reverse Proxy auf einem anderen Gerät im lokalen
# Netz, z. B. einer Synology oder einem nginx, der https für BINTAFELN_DOMAIN übernimmt und an
# http://<IP dieser VM>:80 weitergibt (README „Hinter einem fremden Reverse Proxy“, ADR 0069).
# Einschalten in .env:  COMPOSE_FILE=docker-compose.yml:docker/hinter-fremdem-proxy.yml
#
# Caddy holt dann kein eigenes Zertifikat und leitet nicht auf https um, sondern antwortet auf
# Port 80. Dass der Besucher https benutzt hat und von welcher Adresse er kommt, übernimmt er nur
# aus den Kopfzeilen von Geräten im lokalen Netz (X-Forwarded-Proto, X-Forwarded-For).
services:
  proxy:
    ports: !override
      - "${HTTP_PORT:-80}:80"
    environment:
      SITE_ADDRESS: ":80"
      BINTAFELN_VERTRAUTE_PROXYS: private_ranges
