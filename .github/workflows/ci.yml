name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bintafeln
          POSTGRES_USER: bintafeln
          POSTGRES_PASSWORD: nur-ci-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bintafeln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: nur-ci-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Fehlende Migrationen?
        run: python manage.py makemigrations --check --dry-run --settings=bintafeln.settings_test
      - name: pytest
        run: pytest --cov=apps --cov=bintafeln --cov-branch --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose-Datei prüfen
        run: |
          cp .env.example .env
          sed -i 's/^DJANGO_SECRET_KEY=$/DJANGO_SECRET_KEY=nur-ci/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=nur-ci/' .env
          docker compose config --quiet
      - name: Image bauen
        run: docker build -t bintafeln:ci .
