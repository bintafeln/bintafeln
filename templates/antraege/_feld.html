{% if feld %}<div class="feld{% if feld.errors %} hat-fehler{% endif %}">
  <label for="{{ feld.id_for_label }}">{{ feld.label }}{% if feld.field.required %} *{% endif %}</label>
  {{ feld }}
  {% if feld.help_text %}<small class="hilfe">{{ feld.help_text }}</small>{% endif %}
  {% for fehler in feld.errors %}<small class="fehler">{{ fehler }}</small>{% endfor %}
</div>{% endif %}
