<article class="ausweis-fall">
  {% if z.hat_vorschau %}
    <a class="ausweis-fall-bild" href="{% url 'antraege:anhang' z.a.pk z.anhang_id %}"
       {% if z.anhang_bild %}data-bild{% else %}data-fenster{% endif %}
       title="Antrag {{ z.a.nummer }}" target="_blank" rel="noopener">
      <img class="ausweis-mini" loading="lazy" alt="Vorschau des Nachweises"
           src="{% url 'antraege:ausweis_miniatur' z.a.pk %}"></a>
  {% endif %}
  <div class="ausweis-fall-info">
    <div class="ausweis-fall-kopf">
      <a href="{% url 'antraege:antrag' z.a.pk %}" target="_blank" rel="noopener">{{ z.a.nummer }}</a>
      <span class="leise">· {{ z.a.vorname }} {{ z.a.nachname }}</span>
    </div>
    <div class="ausweis-fall-staaten">
      Angegeben: <strong>{{ z.angegeben|default:"—" }}</strong>
      {% if z.erkannt %}· Im Ausweis: <strong>{{ z.erkannt }}</strong>{% endif %}
    </div>
    <form method="post" action="{% url 'antraege:ausweis_entscheiden' z.a.pk %}" class="ausweis-aktion"
          hx-post="{% url 'antraege:ausweis_entscheiden' z.a.pk %}"
          hx-target="closest article" hx-swap="outerHTML">
      {% csrf_token %}
      {% if z.uebernehmbar %}
        <button type="submit" name="aktion" value="uebernehmen" class="knopf knopf-klein"
                title="Erkannten Staat „{{ z.erkannt }}“ in den Antrag übernehmen">✓ Übernehmen</button>
      {% endif %}
      <button type="submit" name="aktion" value="verwerfen" class="knopf knopf-klein knopf-zweitrangig"
              title="{% if modus == 'unklar' %}Als geprüft abhaken{% else %}Antrag bleibt wie angegeben{% endif %}">
        {% if modus == 'unklar' %}✓ Erledigt{% else %}✕ Nicht übernehmen{% endif %}</button>
      <a class="knopf knopf-klein knopf-zweitrangig" href="{% url 'antraege:antrag' z.a.pk %}"
         target="_blank" rel="noopener" title="Antrag in neuem Tab ansehen">↗ Ansehen</a>
    </form>
  </div>
</article>
