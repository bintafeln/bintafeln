{% extends "base.html" %}
{% block titel %}Einstellungen{% endblock %}
{% block inhalt %}
<section class="karte">
  <h1>Einstellungen der Tafel</h1>
  {% if form.instance.logo %}<img src="{{ form.instance.logo.url }}" alt="Aktuelles Logo" class="logo-vorschau">{% endif %}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "includes/formular.html" %}
    <button type="submit" class="knopf">Speichern</button>
  </form>
</section>
{% endblock %}
