{# Antwort der Verwaltung auf eine Nachricht ohne Kunden, mit „gelesen“ (Startseite, ADR 0140) #}
<div class="notiz notiz-an-stelle">
  <div class="notiz-kopf">
    <span>Zu „{{ n.betreff }}“ · {{ n.beantwortet_am|date:"d.m.Y H:i" }}{% if n.antwort_von %} · {{ n.antwort_von }}{% endif %}</span>
    <form method="post" action="{% url 'kunden:antwort_gelesen' n.pk %}" class="inline">
      {% csrf_token %}<input type="hidden" name="zurueck" value="{{ request.get_full_path }}">
      <button type="submit" class="link-knopf">✓ gelesen</button>
    </form>
  </div>
  <p class="notiz-text">{{ n.antwort|linebreaksbr }}</p>
  <p class="hinweis"><a href="{% url 'kunden:an_verwaltung' %}">Ihre Nachricht ansehen</a></p>
</div>
