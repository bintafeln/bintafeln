{% load notiz %}{# Eine Notiz der Verwaltung an die Ausgabestelle, mit „gelesen“ (Startseite und Sammelseite) #}
<div class="notiz notiz-an-stelle">
  <div class="notiz-kopf">
    <span><a href="{% url 'ausgabe:empfang' %}?nummer={{ n.kundennummer|urlencode }}">Kunde {{ n.kundennummer }}</a> · {{ n.erstellt_am|date:"d.m.Y H:i" }}{% if n.verfasst_von %} · {{ n.verfasst_von }}{% endif %}</span>
    <form method="post" action="{% url 'kunden:notiz_gelesen' n.pk %}" class="inline">
      {% csrf_token %}<input type="hidden" name="zurueck" value="{{ request.get_full_path }}">
      <button type="submit" class="link-knopf">✓ gelesen</button>
    </form>
  </div>
  <p class="notiz-text">{{ n.text|notiz_text }}</p>
</div>
