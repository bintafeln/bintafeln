{% extends "base.html" %}
{% block titel %}Zusatzfeld{% endblock %}
{% block inhalt %}
<section class="karte">
  <p><a href="{% url 'kunden:einstellungen' %}">← Einstellungen Kundenstamm</a></p>
  <h1>{% if feld.pk %}Zusatzfeld „{{ feld.bezeichnung }}“{% else %}Neues Zusatzfeld{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "includes/formular.html" %}
    <button type="submit" class="knopf">Speichern</button>
  </form>
</section>
{% endblock %}
