{# Leerspalten fürs PDF (zum Eintragen oder Unterschreiben): Anzahl und Überschriften. Mit ``formular`` hängen die Felder an einem Formular außerhalb (form="…"). Ausgewertet von listenexport.leerspalten(). #}
<span class="leerspalten">
  <label>Leerspalten im PDF
    <select name="leer"{% if formular %} form="{{ formular }}"{% endif %} title="Leere Spalten rechts in der Liste – zum Eintragen oder für eine Unterschriftenliste">
      <option value="0"{% if leer == "0" or not leer %} selected{% endif %}>keine</option>
      <option value="1"{% if leer == "1" %} selected{% endif %}>1</option>
      <option value="2"{% if leer == "2" %} selected{% endif %}>2</option>
    </select></label>
  <input type="text" name="leer_titel"{% if formular %} form="{{ formular }}"{% endif %} value="{{ leer_titel|default:'' }}" maxlength="90"
         placeholder="Überschriften, z. B. Unterschrift, Anmerkung" aria-label="Überschriften der Leerspalten, mit Komma getrennt"
         class="leerspalten-titel">
</span>
