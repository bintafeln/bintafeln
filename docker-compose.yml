# bintafeln – Installation: cp .env.example .env, Werte anpassen, docker compose up -d
# Betrieb (Update, Sicherung, Wiederherstellung): ./betrieb hilfe
name: bintafeln

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Speicherobergrenze (ADR 0111): schützt einen kleinen Server davor, dass ein einzelner Dienst
    # den gesamten Arbeitsspeicher aufbraucht und die Maschine einfriert.
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bintafeln}
      POSTGRES_USER: ${POSTGRES_USER:-bintafeln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    # Je Installation ein eigenes Abbild, falls mehrere auf einem Server laufen (ADR 0022).
    image: ${COMPOSE_PROJECT_NAME:-bintafeln}:lokal
    restart: unless-stopped
    # Speicherobergrenze für den Webserver samt Hintergrundarbeit, z. B. der Ausweisprüfung
    # (ADR 0111). Läuft ein Prozess hier aus dem Ruder, wird nur dieser Container beendet (und per
    # "restart: unless-stopped" automatisch neu gestartet) – der Server selbst friert nicht ein.
    # Auf einem größeren Server über BINTAFELN_APP_SPEICHER in der .env erhöhen.
    mem_limit: ${BINTAFELN_APP_SPEICHER:-1280m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY fehlt in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      BINTAFELN_DOMAIN: ${BINTAFELN_DOMAIN:-}
      BINTAFELN_HEIMNETZ_ADRESSE: ${BINTAFELN_HEIMNETZ_ADRESSE:-}
      # Nur für die erste Einrichtung des Standard-Sicherungsauftrags (ADR 0042)
      BINTAFELN_SICHERUNG_UHRZEIT: ${BINTAFELN_SICHERUNG_UHRZEIT:-02:30}
      BINTAFELN_SICHERUNG_ANZAHL: ${BINTAFELN_SICHERUNG_ANZAHL:-14}
      BINTAFELN_ZEITZONE: ${BINTAFELN_ZEITZONE:-Europe/Berlin}
      BINTAFELN_LOGLEVEL: ${BINTAFELN_LOGLEVEL:-INFO}
      BINTAFELN_DEMO: ${BINTAFELN_DEMO:-false}
      BINTAFELN_DEMO_PASSWORT: ${BINTAFELN_DEMO_PASSWORT:-}
      BINTAFELN_VERZEICHNIS_URL: ${BINTAFELN_VERZEICHNIS_URL:-}
      BINTAFELN_VERZEICHNIS_EMPFANG: ${BINTAFELN_VERZEICHNIS_EMPFANG:-false}
      # Gemeinsamer Schlüssel mit dem Dienst abruf (Abruf aus dem Vereinsportal, ADR 0127)
      BINTAFELN_ABRUF_SCHLUESSEL: ${BINTAFELN_ABRUF_SCHLUESSEL:-}
      POSTGRES_DB: ${POSTGRES_DB:-bintafeln}
      POSTGRES_USER: ${POSTGRES_USER:-bintafeln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - static:/app/data/static
      - media:/app/data/media
      # nur lesend, für die Anzeige des Sicherungsstatus
      - ${BINTAFELN_SICHERUNG_PFAD:-./sicherungen}:/app/sicherungen:ro
      # Austausch mit dem Dienst updater (Update aus der Oberfläche, ADR 0043)
      - betrieb:/app/data/betrieb
      # Entschlüsselte rclone-Konfig für die Fernsicherung an den Dienst backup (ADR 0106)
      - fernsicherung:/app/data/fernsicherung

  backup:
    build: docker/backup
    image: ${COMPOSE_PROJECT_NAME:-bintafeln}-backup:lokal
    restart: unless-stopped
    mem_limit: 256m  # Speicherobergrenze (ADR 0111)
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-bintafeln}
      PGUSER: ${POSTGRES_USER:-bintafeln}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${BINTAFELN_ZEITZONE:-Europe/Berlin}
      SICHERUNG_SCHLUESSEL: ${BINTAFELN_SICHERUNG_SCHLUESSEL:-}
      SICHERUNG_UHRZEIT: ${BINTAFELN_SICHERUNG_UHRZEIT:-02:30}
      SICHERUNG_ANZAHL: ${BINTAFELN_SICHERUNG_ANZAHL:-14}
    volumes:
      - media:/daten/media:ro
      - ${BINTAFELN_SICHERUNG_PFAD:-./sicherungen}:/sicherungen
      # Fernsicherung: vom Dienst app entschlüsselt bereitgestellte rclone-Konfig (ADR 0106)
      - fernsicherung:/fernsicherung:ro
      # Externe Ziele für Sicherungsaufträge (USB-Platte, NAS; ADR 0042). Später eingehängte
      # Medien sieht der Dienst nach seinem nächsten Neustart (er startet sich alle 30 Minuten
      # neu, wenn er nichts zu tun hat).
      - type: bind
        source: /media
        target: /media
        bind:
          create_host_path: true
      - type: bind
        source: /mnt
        target: /mnt
        bind:
          create_host_path: true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m  # Speicherobergrenze (ADR 0111)
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Leere Domain → Entwicklungsmodus ohne TLS auf Port 80.
      SITE_ADDRESS: ${BINTAFELN_DOMAIN:-:80}
      # Optional: zusätzlich https mit eigenem Zertifikat im Heimnetz (ADR 0041). Leer darf die
      # Variable für Caddy nicht sein, daher der Platzhalter, auf den nie jemand zugreift.
      BINTAFELN_HEIMNETZ_ADRESSE: ${BINTAFELN_HEIMNETZ_ADRESSE:-heimnetz.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy-daten:/data
      - caddy-config:/config

  # Führt Updates aus, die Admins in bintafeln anfordern (Einstellungen → Update, ADR 0043).
  # Nur dieser Dienst darf Docker steuern; er ist von außen nicht erreichbar. bintafeln selbst
  # legt nur einen Auftrag in den gemeinsamen Ordner "betrieb".
  updater:
    build: docker/updater
    image: ${COMPOSE_PROJECT_NAME:-bintafeln}-updater:lokal
    restart: unless-stopped
    mem_limit: 512m  # Speicherobergrenze (ADR 0111); beim Update wird kurz mehr gebraucht
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/projekt
      - betrieb:/betrieb
      # Benutzerkonten des Servers: git und Update laufen als Besitzer des Projektordners
      - /etc/passwd:/host-passwd:ro

  # Holt Finanzexport und Spenderliste aus dem Vereinsportal (Modul „Spendenbelege aus dem
  # Vereinsportal“, ADR 0127). Enthält einen Browser und läuft deshalb nur, wenn die Tafel ihn
  # einschaltet: COMPOSE_PROFILES=abruf und BINTAFELN_ABRUF_SCHLUESSEL in der .env. Von außen
  # nicht erreichbar; bintafeln spricht ihn im internen Netz an.
  abruf:
    profiles: ["abruf"]
    build: docker/abruf
    image: ${COMPOSE_PROJECT_NAME:-bintafeln}-abruf:lokal
    restart: unless-stopped
    mem_limit: 1g  # Speicherobergrenze (ADR 0111); der Browser braucht Platz
    init: true
    environment:
      ABRUF_SCHLUESSEL: ${BINTAFELN_ABRUF_SCHLUESSEL:-}
      TZ: ${BINTAFELN_ZEITZONE:-Europe/Berlin}

volumes:
  db-daten:
  static:
  media:
  caddy-daten:
  caddy-config:
  betrieb:
  fernsicherung:
