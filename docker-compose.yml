# bintafeln – Installation: cp .env.example .env, Werte anpassen, docker compose up -d
name: bintafeln

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bintafeln}
      POSTGRES_USER: ${POSTGRES_USER:-bintafeln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: bintafeln:lokal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY fehlt in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      BINTAFELN_DOMAIN: ${BINTAFELN_DOMAIN:-}
      BINTAFELN_ZEITZONE: ${BINTAFELN_ZEITZONE:-Europe/Berlin}
      BINTAFELN_LOGLEVEL: ${BINTAFELN_LOGLEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-bintafeln}
      POSTGRES_USER: ${POSTGRES_USER:-bintafeln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - static:/app/data/static
      - media:/app/data/media

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Leere Domain → Entwicklungsmodus ohne TLS auf Port 80.
      SITE_ADDRESS: ${BINTAFELN_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy-daten:/data
      - caddy-config:/config

volumes:
  db-daten:
  static:
  media:
  caddy-daten:
  caddy-config:
