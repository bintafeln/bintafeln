[project]
name = "bintafeln"
version = "0.1.0"
description = "Freie Verwaltungssoftware für Tafeln"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/0*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # assert in Tests ist gewollt

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # Test-Passwörter sind Platzhalter

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bintafeln.settings_test"
testpaths = ["tests"]
addopts = "--strict-markers"
